# Supabase CLI settings for the local stack (`supabase start`, needs Docker).
# Hosted projects are configured in the Supabase dashboard; mirror any change there.
project_id = "asterpath"

[api]
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
sign_in_sign_ups = 30
email_sent = 2

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Google sign-in: create an OAuth client in Google Cloud and put its values in
# supabase/.env (git-ignored) as SUPABASE_AUTH_GOOGLE_CLIENT_ID / _SECRET.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false
